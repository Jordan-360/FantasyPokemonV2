# Pulls the latest NFL stats from nflverse and commits them to main.
# Vercel redeploys on the push, so the next fantasy week unlocks on the live site
# without anyone running `npm run build-data` by hand.
#
# Schedule (UTC), September through January only:
#   Tuesday 12:17   the morning after Monday Night Football
#   Wednesday 12:17 retry, in case nflverse posted late
#   Friday 12:17    picks up stat corrections
# It only commits when the data actually changed. Run it any time from the
# Actions tab with "Run workflow".
name: Update NFL stats

on:
  schedule:
    - cron: '17 12 * 9-12,1 2'
    - cron: '17 12 * 9-12,1 3'
    - cron: '17 12 * 9-12,1 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download stats from nflverse
        run: npm run build-data

      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet -- src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new stats."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data
          fi

      # Never ship data that breaks the game
      - name: Test with the new data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm run simulate
          npm run build

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          WEEK=$(node -p "require('./src/data/weekly_points.json').weeksAvailable.at(-1) ?? 0")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Update NFL stats through Week $WEEK"
          git push origin HEAD:main
          echo "### Stats updated through Week $WEEK" >> "$GITHUB_STEP_SUMMARY"
